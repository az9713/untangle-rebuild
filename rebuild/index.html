<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Untangle rebuild</title>
<!--
  REA-only rebuild of Untangle (untangle.exe "Version 20260923.616da16").
  Every target fact cites a claim in ../findings-before-key.md (Cnn) and a REA evidence ID (ev_xxxxxxxx).
  "gap" marks a placeholder for a fact REA did not give. "design" marks a choice of this web page,
  not a fact about the original.
-->
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --line:#334155; --accent:#fb923c; --accent2:#2dd4bf; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 8px; }
  .bar { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; align-items:center; }
  button, select, input { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 8px; font:inherit; }
  button:hover { border-color:var(--accent2); }
  #board { display:block; margin:8px 0; touch-action:none; outline:none; max-width:100%; }
  #msg { color:var(--accent); min-height:1.4em; }
  #gameid { width:100%; box-sizing:border-box; font-family:ui-monospace, monospace; font-size:12px; }
  .muted { color:var(--muted); font-size:12px; }
  label { white-space:nowrap; }
</style>
</head>
<body>
<main>
  <h1>Untangle (REA rebuild)</h1>
  <div class="bar">
    <button id="bNew">New</button>
    <button id="bRestart">Restart</button>
    <button id="bUndo">Undo</button>
    <button id="bRedo">Redo</button>
    <button id="bSolve">Solve</button>
    <select id="sType" aria-label="Type"></select>
  </div>
  <div class="bar">
    <label><input type="checkbox" id="pSnap"> Snap points to a grid</label>
    <label><input type="checkbox" id="pCross"> Show edges that cross another edge</label>
    <label>Display style for vertices <select id="pStyle"><option value="0">Circles</option><option value="1">Numbers</option></select></label>
  </div>
  <canvas id="board" tabindex="0" aria-label="Untangle board"></canvas>
  <div id="msg"></div>
  <div class="bar"><input id="gameid" spellcheck="false" aria-label="Game ID"><button id="bLoad">Load game ID / seed</button></div>
  <p class="muted">Drag the points until no two lines cross. Keyboard: arrows move the cursor, Enter or Space picks up and drops, Tab cycles (key mapping is a gap, see G4).</p>

// ---------------- moves and history (design: a plain undo list) ----------------
function changedState() { ui.drag = -1; ui.justMoved = ui.justDragged; ui.justDragged = false; } // ev_17c98852 (0x140002fb0)
function animLength(from, to) { if (ui.justMoved) return 0; return to.justSolved ? ANIM_SOLVE : ANIM_NORMAL; } // C47 ev_eaa1643a
function flashLength(o, nw) { return (!o.completed && nw.completed && !o.cheated && !nw.cheated) ? FLASH : 0; } // C48 ev_eaa1643a
function goTo(newPos) {
  const dir = newPos > pos ? 1 : -1;
  const from = hist[pos]; pos = newPos; const to = hist[pos];
  changedState();
  const len = animLength(from, dir > 0 ? to : from);  // ev_eaa1643a: dir < 0 reads the first (old) state's flag
  anim = len > 0 ? { from, len, start: performance.now() / 1000 } : null;
  const fl = dir > 0 ? flashLength(from, to) : 0;     // design: flash only on forward moves
  flash = fl > 0 ? { start: performance.now() / 1000 } : null;
  draw();
}
function applyMove(move) {
  const ns = executeMove(hist[pos], move); if (!ns) return false;
  hist = hist.slice(0, pos + 1); hist.push(ns); goTo(pos + 1, true); return true;
}

// ---------------- input (C49-C54, ev_f7ad8758 0x140002fd0) ----------------
function snapTo(mx, my) {                             // C50
  const st = hist[pos], n = st.n;
  ui.x = (Math.trunc((mx * (n - 1)) / (TS * st.w)) * 2 + 1) * st.w;
  ui.y = (Math.trunc((my * (n - 1)) / (TS * st.h)) * 2 + 1) * st.h;
  ui.d = 2 * n - 2;
}
function setDragPos(mx, my) { if (ui.snap) snapTo(mx, my); else { ui.x = mx; ui.y = my; ui.d = TS; } }
function inside() { const st = hist[pos]; return ui.x >= 0 && ui.x < st.w * ui.d && ui.y >= 0 && ui.y < st.h * ui.d; } // C51
function dropMove(i) { ui.justDragged = true; return applyMove("P" + i + ":" + ui.x + "," + ui.y + "/" + ui.d); }

function mouseXY(e) { const r = cv.getBoundingClientRect(); return [Math.trunc((e.clientX - r.left) * cv.width / r.width), Math.trunc((e.clientY - r.top) * cv.height / r.height)]; }
cv.addEventListener("pointerdown", e => {             // C49
  const [mx, my] = mouseXY(e), st = hist[pos];
  let best = -1, bd = 0;
  st.pts.forEach((p, i) => { const dx = Math.trunc((p.x * TS) / p.d) - mx, dy = Math.trunc((p.y * TS) / p.d) - my, dd = dx * dx + dy * dy; if (best < 0 || dd < bd) { best = i; bd = dd; } });
  if (best < 0 || bd > 144) return;                   // 12 px
  ui.drag = best; ui.cursor = -1; setDragPos(mx, my);
  cv.setPointerCapture(e.pointerId); draw();
});
cv.addEventListener("pointermove", e => { if (ui.drag < 0) return; const [mx, my] = mouseXY(e); setDragPos(mx, my); draw(); }); // C50
cv.addEventListener("pointerup", e => {               // C51
  if (ui.drag < 0) return;
  const i = ui.drag; ui.cursor = -1;
  if (inside()) dropMove(i); else { ui.drag = -1; draw(); }
});

// gap G4: physical keys for codes 0x209-0x20d and modifier 0x2000 are inferred, not observed.
const KEYS = { ArrowUp: 0, ArrowDown: 1, ArrowLeft: 2, ArrowRight: 3 };
cv.addEventListener("keydown", e => {
  const st = hist[pos], n = st.n;
  if (e.key in KEYS) {                                // C52, C53
    e.preventDefault(); const dir = KEYS[e.key];
    if (ui.drag >= 0) {                               // move the held point by ts/2
      const half = Math.trunc(TS / 2), dx = dir === 2 ? -half : dir === 3 ? half : 0, dy = dir === 0 ? -half : dir === 1 ? half : 0;
      setDragPos(Math.trunc((ui.x * TS) / ui.d) + dx, Math.trunc((ui.y * TS) / ui.d) + dy);
    } else {
      if (ui.cursor < 0) ui.cursor = 0;
      const c = st.pts[ui.cursor]; let best = -1, bd = 0;
      st.pts.forEach((p, i) => {
        if (i === ui.cursor) return;
        const dx = p.x * c.d - p.d * c.x, dy = p.y * c.d - p.d * c.y;
        if (dx === 0 && dy === 0) return;
        const ok = [dy <= -Math.abs(dx), dy >= Math.abs(dx), Math.abs(dy) <= -dx, Math.abs(dy) <= dx][dir];
        if (!ok) return;
        const dd = Math.floor((dx * dx + dy * dy) / ((p.d * c.d) * (p.d * c.d)));   // unsigned integer division, then float
        if (dd < bd || best < 0) { best = i; bd = dd; }
      });
      if (best >= 0) ui.cursor = best;
    }
    draw();
  } else if (e.key === "Enter" || e.key === " ") {    // C53 select (0x20d)
    e.preventDefault();
    if (ui.drag >= 0) { const i = ui.drag; ui.cursor = i; if (inside()) dropMove(i); else { ui.drag = -1; draw(); } }
    else if (ui.cursor >= 0) { const p = st.pts[ui.cursor]; ui.drag = ui.cursor; ui.cursor = -1; ui.x = Math.trunc((p.x * TS) / p.d); ui.y = Math.trunc((p.y * TS) / p.d); ui.d = TS; draw(); }
    else { ui.cursor = 0; draw(); }
  } else if (e.key === "Tab") {                       // C54
    e.preventDefault();
    if (ui.drag >= 0) return;

// ---------------- game setup (C15, C18, C21) ----------------
function randomSeed() {                               // C15 form: 15 digits, first 1-9 (midend RNG itself: design, not replicated)
  let s = String(1 + Math.floor(Math.random() * 9)); for (let i = 0; i < 14; i++) s += Math.floor(Math.random() * 10); return s;
}
function startGame(n, desc, auxStr, seedStr) {
  params = n; aux = auxStr; seed = seedStr;
  hist = [newState(n, desc)]; pos = 0; anim = flash = null;
  ui.drag = ui.cursor = -1; ui.justDragged = ui.justMoved = false;
  document.getElementById("gameid").value = seed ? n + "#" + seed : n + ":" + desc;
  document.getElementById("sType").value = [6, 10, 15, 20, 25].includes(n) ? String(n) : "custom";
  setMsg(""); draw();
}
function newFromSeed(n, seedStr) { const g2 = newDesc(n, randomNew(seedStr)); startGame(n, g2.desc, g2.aux, seedStr); } // C15 random_new(seed, strlen)
function loadId(id) {                                 // C21 ev_cb816f3e: first of ':' or '#' splits
  id = id.trim();
  const ci = id.indexOf(":"), hi = id.indexOf("#");
  const sep = ci < 0 ? hi : hi < 0 ? ci : Math.min(ci, hi);
  const n = parseInt(sep < 0 ? id : id.slice(0, sep), 10) || 0;   // C16 atoi
  const e = validateParams(n); if (e) return setMsg(e);
  if (sep < 0) return newFromSeed(n, randomSeed());
  const rest = id.slice(sep + 1);
  if (id[sep] === "#") return newFromSeed(n, rest);
  const e2 = validateDesc(n, rest); if (e2) return setMsg(e2);
  startGame(n, rest, null, null);
}
function setMsg(s) { document.getElementById("msg").textContent = s; }

const sType = document.getElementById("sType");
[6, 10, 15, 20, 25].forEach(v => sType.add(new Option(v + " points", String(v))));   // C18 ev_f3e4cc63
sType.add(new Option("Custom...", "custom"));          // C19
sType.addEventListener("change", () => {
  let n = sType.value === "custom" ? parseInt(prompt("Number of points", String(params)) || "", 10) : +sType.value; // C19 field name
  const e = validateParams(n); if (e) { setMsg(e); sType.value = String(params); return; }
  newFromSeed(n, randomSeed());
});
document.getElementById("bNew").onclick = () => newFromSeed(params, randomSeed());
document.getElementById("bRestart").onclick = () => { if (pos > 0) { hist = hist.slice(0, pos + 1); hist.push(dupState(hist[0])); goTo(pos + 1, true); } }; // design
document.getElementById("bUndo").onclick = () => { if (pos > 0) goTo(pos - 1, false); };
document.getElementById("bRedo").onclick = () => { if (pos < hist.length - 1) goTo(pos + 1, false); };
document.getElementById("bSolve").onclick = () => { const r = solveMove(hist[pos], aux); if (r.err) setMsg(r.err); else applyMove(r.move); };
document.getElementById("bLoad").onclick = () => loadId(document.getElementById("gameid").value);
document.getElementById("pSnap").onchange = e => { ui.snap = e.target.checked; };
document.getElementById("pCross").onchange = e => { ui.showCross = e.target.checked; draw(); };
document.getElementById("pStyle").onchange = e => { ui.numbers = e.target.value === "1"; draw(); };

// Test and capture hook (design): window.untangle.load("10#123"), .move("P0:1,1/1"), .state()
window.untangle = { load: loadId, move: applyMove, state: () => hist[pos], aux: () => aux, newDesc: (n, s) => newDesc(n, randomNew(s)), cross };
const q = new URLSearchParams(location.search).get("id");
loadId(q || "10#" + randomSeed());
</script>
